name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets
        run: |
          if git ls-files .env | grep -q .env; then
            echo "::error ::SECURITY: .env file is tracked in git!"
            exit 1
          fi
          ! grep -rn "sk-[a-zA-Z0-9]" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.mjs" apps/ packages/ | grep -v "\.test\." | grep -v "example\|placeholder\|your_"
          echo "No secrets detected in source code"

  static-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios_password
          POSTGRES_DB: aios_v2
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Assert runtime matrix
        run: '[ "$(node -p ''process.versions.node.split(".")[0]'')" = "20" ] && [ "$(corepack pnpm --version)" = "10.28.1" ]'
      - run: pnpm install --frozen-lockfile
      # apps/web lint runs `eslint . && tsc --noEmit`, which needs the generated
      # Prisma client and the workspace *library* packages' built dist/types —
      # not a full `pnpm build` (that would also run `next build` and apps/api's
      # tsc build, which lint doesn't need).
      - run: pnpm db:generate
      - run: pnpm --filter "./packages/**" build
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://aios:aios_password@localhost:5432/aios_v2
      REDIS_URL: redis://localhost:6379
      CI_INTEGRATION: '1'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios_password
          POSTGRES_DB: aios_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Assert runtime matrix
        run: '[ "$(node -p ''process.versions.node.split(".")[0]'')" = "20" ] && [ "$(corepack pnpm --version)" = "10.28.1" ]'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm --filter "./packages/**" build
      - run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            apps/web/coverage
            apps/api/coverage
            packages/agent/coverage
            packages/auth/coverage
            packages/business/coverage
            packages/db/coverage
            packages/infra/coverage
            packages/shared/coverage
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: [static-checks, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Assert runtime matrix
        run: '[ "$(node -p ''process.versions.node.split(".")[0]'')" = "20" ] && [ "$(corepack pnpm --version)" = "10.28.1" ]'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    env:
      DATABASE_URL: postgresql://aios:aios_password@localhost:5432/aios_v2
      CI_INTEGRATION: '1'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios_password
          POSTGRES_DB: aios_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Assert runtime matrix
        run: '[ "$(node -p ''process.versions.node.split(".")[0]'')" = "20" ] && [ "$(corepack pnpm --version)" = "10.28.1" ]'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e
        run: pnpm test:e2e
