name: Services CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/services-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/services-ci.yml'

jobs:
  engineer-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sangfor-engineer-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: services/sangfor-engineer-mcp/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'services/sangfor-engineer-mcp/.nvmrc'
      - name: Assert runtime matrix
        run: '[ "$(node -p ''process.versions.node.split(".")[0]'')" = "20" ] && [ "$(corepack pnpm --version)" = "10.28.1" ]'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present build
      - run: pnpm run --if-present test -- --run

  mcp-workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sangfor-mcp-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: services/sangfor-mcp-workflow/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'services/sangfor-mcp-workflow/.nvmrc'
      - name: Assert runtime matrix
        run: '[ "$(node -p ''process.versions.node.split(".")[0]'')" = "22" ] && [ "$(corepack pnpm --version)" = "10.28.1" ]'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test -- --run
      - run: pnpm build
      - run: pnpm test:production
