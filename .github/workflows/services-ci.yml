name: Services CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/services-ci.yml'
      - 'scripts/release-gate.manifest.json'
      - 'scripts/run-workspace-runtime.sh'
      - 'scripts/verify-release.mjs'
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/services-ci.yml'
      - 'scripts/release-gate.manifest.json'
      - 'scripts/run-workspace-runtime.sh'
      - 'scripts/verify-release.mjs'

jobs:
  engineer-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sangfor-engineer-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: services/sangfor-engineer-mcp/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'services/sangfor-engineer-mcp/.nvmrc'
      - name: Assert runtime matrix
        run: '[ "$(node -p ''process.versions.node.split(".")[0]'')" = "20" ] && [ "$(corepack pnpm --version)" = "10.28.1" ]'
      - run: pnpm install --frozen-lockfile
      # U007: no --if-present / continue-on-error; fail if scripts missing
      - run: pnpm lint
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm exec vitest run --config vitest.config.ts --exclude tests/store.test.ts --exclude tests/rag-embedding.test.ts
      - run: pnpm build

  mcp-workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sangfor-mcp-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: services/sangfor-mcp-workflow/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'services/sangfor-mcp-workflow/.nvmrc'
      - name: Assert runtime matrix
        run: '[ "$(node -p ''process.versions.node.split(".")[0]'')" = "22" ] && [ "$(corepack pnpm --version)" = "10.28.1" ]'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:types
      - run: pnpm exec vitest run --exclude tests/ai-workflow.test.ts
      - run: pnpm exec vitest run tests/ai-workflow.test.ts
      - run: pnpm build
      - run: pnpm test:production
