# Sangfor Agentic Company OS — Unified Docker Compose
version: "3.8"

services:
  # ═══ Core Infrastructure ═══
  postgres:
    image: postgres:16-alpine
    container_name: sangfor-postgres
    environment:
      POSTGRES_USER: sangfor
      POSTGRES_PASSWORD: sangfor_password
      POSTGRES_DB: sangfor_os
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sangfor"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sangfor-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ═══ Database Migration ═══
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://sangfor:sangfor_password@postgres:5432/sangfor_os
    depends_on:
      postgres:
        condition: service_healthy

  # ═══ Application Servers ═══
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3200:3200"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sangfor:sangfor_password@postgres:5432/sangfor_os
      REDIS_URL: redis://redis:6379
      FINANCE_API_KEY: ${FINANCE_API_KEY:-sangfor-internal-finance}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # The CFO/finance API is served by `api` at /api/cfo (single backend,
  # public schema). The former standalone finance service was removed.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3101:3101"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3200
      NEXT_PUBLIC_FINANCE_URL: http://localhost:3200/api/cfo
      FINANCE_API_URL: http://api:3200/api/cfo
      CFO_API_URL: http://api:3200/api/cfo
      FINANCE_API_KEY: ${FINANCE_API_KEY:-sangfor-internal-finance}
    depends_on:
      api:
        condition: service_healthy

  # ═══ External Services (Mock Mode) ═══
  # These are STATIC 200 stubs, not real services. They are gated behind the
  # `mock` profile so a plain `docker compose up` never starts them (a green
  # stub would otherwise read as "working"). Start explicitly with:
  #   docker compose --profile mock up -d
  mail-intelligence:
    image: node:20-alpine
    profiles: ["mock"]
    command: node -e "const http=require('http');http.createServer((q,r)=>{r.writeHead(200,{'Content-Type':'application/json'});r.end(JSON.stringify({status:'ok',service:'mail-intelligence'}))}).listen(3010)"
    ports:
      - "3010:3010"

  # ═══ Sangfor MCP Services (extracted) ═══
  # The MCP services were split into standalone repos (2026-07-01):
  #   ~/Playground/whelp99-code-sangfor-engineer-mcp  (HTTP bridge 3600, console 3502, mock 3400)
  #   ~/Playground/sangfor-mcp-workflow               (console 3500)
  # Run them from their own repos (each has its own docker-compose / dev scripts).
  # sangfor-os reaches them over HTTP via these env vars (see .env example):
  #   WHELP99_MCP_HTTP_URL, WHELP99_OPERATOR_CONSOLE_URL, SANGFOR_MCP_URL
  # See docs/superpowers/specs/2026-07-01-separate-mcp-and-vibecoding-design.md

  # ═══ Monitoring ═══
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

  # ═══ Reverse Proxy ═══
  caddy:
    build:
      context: ./docker/caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
